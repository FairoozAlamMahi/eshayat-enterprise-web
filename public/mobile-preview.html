<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile & Desktop Device Preview — M/S Eshayat Enterprise</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
    }
    .badge {
      background: #f59e0b;
      color: #0f172a;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    button, a.btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }
    button:hover, a.btn:hover {
      background: #334155;
      color: #fff;
    }
    button.active {
      background: #f59e0b;
      color: #0f172a;
      border-color: #f59e0b;
      font-weight: 700;
    }
    .page-links {
      display: flex;
      gap: 6px;
      align-items: center;
      border-left: 1px solid #334155;
      padding-left: 12px;
    }
    main {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 32px;
      padding: 28px 20px;
      overflow-x: auto;
    }
    .device-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .device-label {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .phone-frame {
      background: #000;
      border: 10px solid #1e293b;
      border-radius: 40px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255,255,255,0.08);
      overflow: hidden;
      position: relative;
      transition: width 0.25s ease, height 0.25s ease;
    }
    .phone-notch {
      height: 24px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #1e293b;
    }
    .phone-speaker {
      width: 60px;
      height: 5px;
      background: #334155;
      border-radius: 99px;
    }
    iframe {
      border: none;
      display: block;
      background: #fff;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="badge">Live Simulator</span>
      <span>M/S Eshayat Enterprise — Phone View on PC</span>
    </div>
    <div class="controls">
      <button id="btn-iphone" class="active" onclick="setSize(390, 844, 'iPhone 14 / 15 Pro (390×844)', 'btn-iphone')">📱 iPhone (390×844)</button>
      <button id="btn-android" onclick="setSize(412, 915, 'Samsung Galaxy / Pixel (412×915)', 'btn-android')">📱 Android (412×915)</button>
      <button id="btn-se" onclick="setSize(375, 667, 'Compact Phone (375×667)', 'btn-se')">📱 Compact (375×667)</button>
      <button id="btn-tablet" onclick="setSize(768, 1024, 'iPad / Tablet (768×1024)', 'btn-tablet')">📟 Tablet (768×1024)</button>

      <div class="page-links">
        <button onclick="setPage('/hci-design-lab.html')" style="background:#0284c7;color:#fff;font-weight:800;">✨ HCI Design Lab (New)</button>
        <button onclick="setPage('/design-gallery.html')" style="background:#f59e0b;color:#0f172a;font-weight:700;">🎨 25 Designs Gallery</button>
        <button onclick="setPage('/')">Home</button>
        <button onclick="setPage('/products')">Catalog</button>
        <button onclick="setPage('/institutional-supply')">Tenders</button>
        <button onclick="setPage('/contact')">Contact</button>
        <button onclick="setPage('/admin')">Admin</button>
      </div>

      <a class="btn" href="/" target="_blank" style="background:#0284c7;border-color:#0369a1;color:#fff;">🖥 Open Full Desktop View ↗</a>
    </div>
  </header>

  <main>
    <div class="device-wrapper">
      <div class="device-label" id="device-title">iPhone 14 / 15 Pro (390×844)</div>
      <div class="phone-frame">
        <div class="phone-notch"><div class="phone-speaker"></div></div>
        <iframe id="preview-frame" src="/" width="390" height="844"></iframe>
      </div>
    </div>
  </main>

  <script>
    function setSize(w, h, label, btnId) {
      const frame = document.getElementById('preview-frame');
      frame.width = w;
      frame.height = h;
      document.getElementById('device-title').textContent = label;
      document.querySelectorAll('.controls > button').forEach(b => b.classList.remove('active'));
      document.getElementById(btnId).classList.add('active');
    }
    function setPage(path) {
      document.getElementById('preview-frame').src = path;
    }
  </script>
</body>
</html>
